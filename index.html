<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页工具库</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f4f8fd;
      --card: #fff;
      --text: #172b4d;
      --muted: #7185a6;
      --border: #dce8f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    .header {
      display: flex; align-items: center; justify-content: space-between; gap: 20px;
      padding: 24px 4%; background: #f8fbff; border-bottom: 1px solid var(--border);
    }
    .brand { display: flex; align-items: center; gap: 18px; min-width: 0; }
    .brand-icon {
      display: grid; place-items: center; width: 64px; height: 64px; flex: 0 0 auto;
      border-radius: 16px; background: linear-gradient(135deg, #60a5fa, #2563eb);
      color: white; font-size: 34px;
    }
    h1 { margin: 0; font-size: clamp(23px, 3vw, 32px); }
    .subtitle { margin: 7px 0 0; color: var(--muted); font-size: 14px; }
    .help-button {
      display: inline-flex; align-items: center; gap: 8px; flex: 0 0 auto;
      padding: 11px 17px; border: 1px solid #6ba0ff; border-radius: 10px;
      background: white; color: var(--primary); text-decoration: none; font-weight: 600;
    }
    .help-button:hover { background: #eff6ff; }
    .category-bar {
      display: flex; flex-wrap: wrap; gap: 10px; padding: 16px 4%;
      background: white; border-bottom: 1px solid var(--border);
    }
    .category-btn {
      padding: 10px 22px; border: 1px solid var(--border); border-radius: 9px;
      background: white; color: var(--text); cursor: pointer; font-size: 14px;
    }
    .category-btn:hover, .category-btn.active {
      color: white; border-color: var(--primary); background: var(--primary);
    }
    main { max-width: 1500px; margin: 0 auto; padding: 26px 4%; }
    .toolbar {
      display: flex; justify-content: space-between; align-items: center;
      gap: 16px; flex-wrap: wrap; margin-bottom: 22px;
    }
    .toolbar h2 { margin: 0; font-size: 22px; }
    .search {
      width: min(360px, 100%); padding: 12px 14px; border: 1px solid #cbdcf4;
      border-radius: 10px; background: white; font-size: 14px; outline: none;
    }
    .search:focus { border-color: var(--primary); box-shadow: 0 0 0 3px #dbeafe; }
    .tool-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px;
    }
    .tool-card {
      display: block; min-width: 0; padding: 22px; border: 1px solid var(--border);
      border-radius: 12px; background: var(--card); color: inherit; text-decoration: none;
      transition: transform .18s, box-shadow .18s, border-color .18s;
    }
    .tool-card:hover { transform: translateY(-3px); box-shadow: 0 9px 25px #0f172a12; border-color: #9fc3ff; }
    .tool-icon {
      display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 16px;
      border-radius: 13px; background: #e8f1ff; font-size: 27px;
    }
    .tool-card h3 { margin: 0 0 9px; font-size: 17px; }
    .tool-card p { margin: 0 0 14px; min-height: 42px; color: var(--muted); font-size: 13px; line-height: 1.7; }
    .tool-category { display: inline-block; padding: 5px 11px; border-radius: 99px; background: #eaf2ff; color: #2563eb; font-size: 12px; }
    .empty { grid-column: 1 / -1; padding: 60px 10px; text-align: center; color: var(--muted); }
    footer { padding: 24px 10px; border-top: 1px solid var(--border); color: var(--muted); text-align: center; font-size: 12px; }
    @media (max-width: 600px) {
      .header { padding: 20px 4%; }
      .brand { gap: 12px; }
      .brand-icon { width: 48px; height: 48px; font-size: 25px; border-radius: 12px; }
      .subtitle { font-size: 12px; }
      .help-button { padding: 9px 11px; }
      .category-bar { gap: 8px; }
      .category-btn { padding: 9px 13px; }
      main { padding: 22px 4%; }
      .tool-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .tool-card { padding: 15px; }
    }
    @media (max-width: 350px) { .tool-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">▣</div>
      <div>
        <h1>网页工具库</h1>
        <p class="subtitle">把常用工具集中起来，让工作更简单。</p>
      </div>
    </div>
    <!-- 帮助按钮：跳转到同目录下的 help.html -->
    <a class="help-button" href="help.html" title="查看工具库使用教程">
      <span aria-hidden="true">ⓘ</span> 帮助
    </a>
  </header>

  <nav class="category-bar" id="categoryBar" aria-label="工具分类"></nav>

  <main>
    <div class="toolbar">
      <h2 id="sectionTitle">全部工具</h2>
      <input id="searchInput" class="search" type="search"
             placeholder="搜索工具名称或简介..." aria-label="搜索工具">
    </div>
    <section class="tool-grid" id="toolGrid" aria-label="工具列表"></section>
  </main>

  <footer>网页工具库 · 本地工具集合</footer>

  <script>
    /*
     * 【配置区 1：分类】
     * 新增分类：在数组中增加一个字符串。
     * 分类名称必须与工具配置中的 category 完全一致。
     */
    const categories = [
      "文本处理",
      "数据处理",
      "开发辅助",
      "文件工具",
      "图像处理"
    ];

    /*
     * 【配置区 2：工具】
     * 新增工具：复制一个对象，修改 name/category/icon/description/href。
     * 工具文件统一放在 tools 文件夹中。
     */
    const tools = [
      {
        name: "JSON 格式化",
        category: "数据处理",
        icon: "📋",
        description: "格式化、校验和查看 JSON 数据。",
        href: "tools/json-formatter.html"
      },
      {
        name: "进制转换",
        category: "数据处理",
        icon: "📋",
        description: "2，8，10，16进制相关转换。",
        href: "tools/base_conversion.html"
      },
	  {
        name: "浮点数转换",
        category: "数据处理",
        icon: "🔄",
        description: "单/双精度及其2，16进制相关转换。",
        href: "tools/float_point_conversion.html"
      },
	  {
        name: "时间戳转换",
        category: "开发辅助",
        icon: "🕒",
        description: "Unix 时间戳与日期时间互相转换。",
        href: "tools/timestamp-converter.html"
      },
      {
        name: "文本对比",
        category: "文本处理",
        icon: "📝",
        description: "对比两段文本，快速定位差异。",
        href: "tools/text-diff.html"
      },
      {
        name: "文件信息查看",
        category: "文件工具",
        icon: "📁",
        description: "查看所选文件的名称、大小等信息。",
        href: "tools/file-info.html"
      },
      {
        name: "CSV 转 JSON",
        category: "数据处理",
        icon: "🔄",
        description: "将 CSV 表格文本转换为 JSON 数据。",
        href: "tools/csv-to-json.html"
      },
      {
        name: "图片尺寸查看",
        category: "图像处理",
        icon: "🖼️",
        description: "查看图片尺寸和宽高比例。",
        href: "tools/image-info.html"
      },
      {
        name: "HTML 转义",
        category: "开发辅助",
        icon: "〈〉",
        description: "将特殊字符转换为 HTML 实体。",
        href: "tools/html-escape.html"
      },
      {
        name: "进制转换",
        category: "开发辅助",
        icon: "🔢",
        description: "支持二进制、八进制、十进制、十六进制互转。",
        href: "tools/base-converter.html"
      },
      {
        name: "Base64 编码解码",
        category: "数据处理",
        icon: "🔐",
        description: "在 Base64 与文本之间进行转换。",
        href: "tools/base64.html"
      },
      {
        name: "PDF 工具",
        category: "文件工具",
        icon: "📄",
        description: "PDF 相关的转换与处理工具入口。",
        href: "tools/pdf-tools.html"
      }
    ];

    let activeCategory = "全部";
    const categoryBar = document.getElementById("categoryBar");
    const toolGrid = document.getElementById("toolGrid");
    const searchInput = document.getElementById("searchInput");
    const sectionTitle = document.getElementById("sectionTitle");

    function renderCategories() {
      categoryBar.replaceChildren();
      ["全部", ...categories].forEach(category => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "category-btn";
        button.textContent = category;
        button.setAttribute("aria-pressed", String(category === activeCategory));
        if (category === activeCategory) button.classList.add("active");
        button.addEventListener("click", () => {
          activeCategory = category;
          renderCategories();
          renderTools();
        });
        categoryBar.appendChild(button);
      });
    }

    function renderTools() {
      const keyword = searchInput.value.trim().toLocaleLowerCase();
      const filteredTools = tools.filter(tool => {
        const categoryMatch = activeCategory === "全部" || tool.category === activeCategory;
        const searchableText = `${tool.name} ${tool.description} ${tool.category}`.toLocaleLowerCase();
        return categoryMatch && searchableText.includes(keyword);
      });

      sectionTitle.textContent = activeCategory === "全部" ? "全部工具" : activeCategory;
      toolGrid.replaceChildren();

      if (filteredTools.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "没有找到相关工具";
        toolGrid.appendChild(empty);
        return;
      }

      filteredTools.forEach(tool => {
        const card = document.createElement("a");
        card.className = "tool-card";
        card.href = tool.href;

        const icon = document.createElement("div");
        icon.className = "tool-icon";
        icon.textContent = tool.icon;

        const title = document.createElement("h3");
        title.textContent = tool.name;

        const description = document.createElement("p");
        description.textContent = tool.description;

        const category = document.createElement("span");
        category.className = "tool-category";
        category.textContent = tool.category;

        card.append(icon, title, description, category);
        toolGrid.appendChild(card);
      });
    }

    searchInput.addEventListener("input", renderTools);
    renderCategories();
    renderTools();
  </script>
</body>
</html>
